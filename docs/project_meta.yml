# ============================================================
# 프로젝트 전략 기획서 및 포트폴리오 메타데이터
# ParkFrame — 영상편집자 박민서 개인 랜딩페이지 개선
# ============================================================

project_info:
  title: "ParkFrame 랜딩페이지 개선 (시안 A / 시안 B)"
  date: "2026-08-11"
  category: "UI/UX / Personal Branding / Conversion Design"
  client: "박민서 (영상편집자 · 2001년생)"
  deliverables:
    - "ParkFrame_A_cut.html      # 시안 A — 편집실 다크"
    - "ParkFrame_B_brief.html    # 시안 B — 채용 브리프 라이트"
    - "portfolio_guide.md        # 전략 가이드 및 진단"
    - "project_meta.yml          # 본 문서"

# ------------------------------------------------------------
# 1. 전략적 토대 (두 시안 공통)
# ------------------------------------------------------------
strategic_foundation:
  why:
    goal: >
      영상 실무 7개월 · 커리어 3년 5개월인 주니어 영상편집자가
      '경력이 짧다'는 이유로 서류에서 걸러지지 않고 면접 기회를 확보하는 것.
      기존 페이지는 심미적으로 완성됐으나 이력서와 숫자가 불일치해
      검증 단계에서 신뢰를 잃을 구조적 위험을 안고 있었다.
    success_kpi:
      - "히어로 릴 30초 이상 시청률 60%"
      - "이력서 PDF 다운로드율 40%"
      - "연락(메일/전화) 전환율 8%"
      - "최종 지표: 지원 대비 면접 제안률 (배포 전 기준선 기록 필수)"
    baseline_risk: >
      기존 페이지 '실무 경력 2년 11개월' 표기가 이력서(총 1년 3개월, 영상 실무 7개월)와
      불일치. 채용담당자의 대조 검증 시 전체 주장의 신뢰도 붕괴 → 최우선 수정 항목.

  who:
    target_audience:
      primary: "게임·애니메이션 / 모션그래픽 스튜디오의 영상팀 리드·PD (이력서 지원분야 기준)"
      secondary: "영상 프로덕션 · 교육콘텐츠 제작사 채용 실무자"
    customer_language:
      - "혼자 컷 뽑을 수 있어요?"
      - "납기 지킬 수 있나요?"
      - "AE 어디까지 되세요?"
      - "왜 3개월만 다녔어요?"
    user_psychology: >
      하루에 포트폴리오 수십 건을 훑는 상태. 의심이 기본값이며,
      경력 3년 미만 지원자에게는 '사수 없이 굴러갈 수 있는가'를 가장 먼저 본다.
      화려함에는 이미 둔감해져 있고, 검증 가능한 사실에 반응한다.

  what:
    desired_action: "3초 릴 재생 → 30초 케이스 스캔 → 90초 내 이력서 PDF 다운로드 또는 메일 클릭"
    anti_action: "위 3단 경로에서 벗어나는 CTA는 페이지 어디에도 두지 않는다"

# ------------------------------------------------------------
# 2. 팩트 교정 대장 (기존 페이지 → 개선안)
# ------------------------------------------------------------
fact_corrections:
  - field: "실무 경력"
    before: "2년 11개월"
    after: "영상 커리어 3년 5개월 / 회사 실무 7개월 (분리 표기)"
    rationale: "뭉뚱그린 과장보다 분리된 사실이 대조 검증을 통과하므로 더 강하다"
  - field: "코스믹블랙 재직"
    before: "2023.08 — 2024.05 · 실무 10개월"
    after: "2023.08–11 인턴 4개월 / 2024.03–05 재합류 3개월 (공백 명시)"
    rationale: "이력서상 분리된 두 기간. 재합류 사실은 오히려 '다시 부른 사람'이라는 강점"
  - field: "자격증명"
    before: "전자기능사"
    after: "전자기기기능사 (2019.07, 한국산업인력공단)"
    rationale: "자격증명 오기는 서류 검증에서 가장 먼저 걸리는 항목"
  - field: "희망 근무지"
    before: "용산 · 강남 · 금천"
    after: "용산 · 강남 · 금천 · 성북"
  - field: "고용 형태"
    before: "정규직 / 프리랜서"
    after: "정규직 / 프리랜서 / 인턴"
  - field: "지원 산업"
    before: "(페이지에 없음)"
    after: "게임·애니메이션 > 모션그래픽 > 영상편집 (히어로 및 요약 바에 명시)"
    rationale: "타깃이 없는 페이지는 아무도 자기 이야기로 읽지 않는다"
  - field: "GTQ 1급 / GTQi 2급"
    status: "확인 필요"
    note: "이력서(2026.02.23 최종수정)에 미기재. 취득했다면 이력서를 먼저 갱신할 것"

# ------------------------------------------------------------
# 2-1. 영상-프로젝트 매칭 오류 (가장 치명적인 발견)
#      YouTube oEmbed API로 5개 ID의 실제 제목을 조회해 확인
# ------------------------------------------------------------
video_mapping_audit:
  method: "https://www.youtube.com/oembed?format=json&url=... 로 각 ID의 실제 제목 조회"
  severity: "critical — 클릭하면 설명과 다른 영상이 재생됨. 그 자리에서 서류 탈락"
  findings:
    - id: "8rwn5j6TBUQ"
      actual_title: "STEP 기업 콘텐츠 영상 | 영상편집 포트폴리오"
      old_label: "VR 병원 소개 영상"
      verdict: mismatch
    - id: "V_zIek_ELSo"
      actual_title: "KBI 기업 콘텐츠 영상 | 영상편집 포트폴리오"
      old_label: "포스코 공사현장 안전교육 영상"
      verdict: mismatch
    - id: "BB0tEUYVlbA"
      actual_title: "아이폰 17 Pro 콘셉트 예고편 | 영상편집 개인작업 포트폴리오"
      old_label: "천재교육 수학 영상 스토리보드"
      verdict: mismatch
    - id: "gFPZGNdLp6A"
      actual_title: "아이폰 17 Pro 광고 콘셉트 영상 | 영상편집 개인작업 포트폴리오"
      old_label: "모션그래픽 광고 스타일 포트폴리오"
      verdict: acceptable
    - id: "Odns3Lwi-1w"
      actual_title: "포스코이앤씨 기업 콘텐츠 영상 | 영상편집 포트폴리오"
      old_label: "신입 인턴 교육 영상 총괄"
      verdict: mismatch
  resolution:
    - "CASE 01(포스코) → Odns3Lwi-1w 로 교체"
    - "CASE 02(VR 병원) · CASE 03(천재교육) → 공개본 없음. '공개 링크 없음 · 요청 시 개별 공유' 플레이스홀더"
    - "STEP · KBI · 아이폰 17 Pro 2편 → 유튜브 실제 제목 그대로 갤러리 배치"
    - "히어로 릴 → gFPZGNdLp6A (아이폰 17 Pro 광고 콘셉트, 임시)"
  open_questions:
    - "Odns3Lwi-1w가 이력서상 '포스코 공사현장 안전교육 영상'과 동일한 작업물인가?"
    - "VR 병원 영상 · 천재교육 스토리보드의 공개 링크가 따로 존재하는가?"

# ------------------------------------------------------------
# 3. 시안 A — "CUT" (편집실 다크)
# ------------------------------------------------------------
concept_a:
  codename: "CUT"
  one_liner: "스크롤이 곧 시퀀스 재생 — 편집실 UI를 그대로 페이지 문법으로"
  intentional_decisions:
    emotion_evoked: "도구적 신뢰 — '이 사람 실제 편집실에서 굴러본 사람이구나'"
    visual_strategy:
      colors:
        palette: ["#0B0C0E (NLE 다크)", "#FF9E2C (앰버)", "#3DDC97 (렌더 그린)"]
        rationale: >
          Premiere·After Effects 타임라인의 다크 UI와 렌더바 색에서 직접 가져옴.
          기존 보라 그라디언트는 '크리에이터 일반'의 클리셰라 직군 식별력이 없었다.
          색 자체가 '영상편집자'라는 직군 코드로 기능하도록 교체.
      typography:
        font_family: "Pretendard (본문) / ui-monospace (라벨·타임코드)"
        rationale: "monospace 타임코드 라벨이 편집실 메타포를 문자 레벨에서 지탱"
      layout:
        style: "상단 고정 플레이헤드 진행바 + SEQ 01~06 섹션 구조"
        rationale: "스크롤 진행이 시퀀스 재생과 동일하게 읽히도록 설계. 구조가 곧 직무 증명"
      removed:
        - item: "가로 드래그 필름스트립"
          rationale: "모바일 스크롤 충돌 + 스캔 비용 증가. 채용담당자는 훑기를 원한다"
        - item: "iframe 5개 동시 로드"
          rationale: "LCP 지연. 썸네일 파사드로 교체해 클릭 시에만 iframe 삽입"
  best_for: "게임·애니·모션그래픽 스튜디오, 크리에이티브 팀 리드"

# ------------------------------------------------------------
# 4. 시안 B — "BRIEF" (채용 브리프 라이트)
# ------------------------------------------------------------
concept_b:
  codename: "BRIEF"
  one_liner: "화려함이 아니라 읽기 쉬움으로 경쟁하는 1페이지 채용 브리프"
  intentional_decisions:
    emotion_evoked: "침착함 · 정직함 · 검증 가능함"
    visual_strategy:
      colors:
        palette: ["#FBFAF8 (페이퍼)", "#16181D (잉크)", "#2A5BD7 (코발트)"]
        rationale: >
          문서적 신뢰. 코발트는 링크와 검증 표식에만 제한 사용해
          시선 예산(attention budget)을 CTA 한 곳에 집중시킨다.
      typography:
        font_family: "Pretendard"
        rationale: "장식 없는 본문 위계로 스캔 속도 최적화. 정보 밀도가 곧 설득력"
      layout:
        style: "상단 sticky 요약 바 + Q&A + 사실 대조표"
        rationale: >
          스크롤 위치와 무관하게 직무·투입가능일·고용형태·지역이 항상 보인다.
          채용담당자의 판단 비용을 0에 가깝게 만드는 것이 이 시안의 유일한 목표.
    signature_sections:
      - name: "채용담당자가 궁금해하실 5가지"
        rationale: "고객의 실제 언어(4개 질문)를 그대로 섹션화해 면접 전 의심을 선처리"
      - name: "솔직하게 말씀드립니다"
        rationale: >
          경력 공백과 짧은 실무 기간은 어차피 이력서에서 보인다.
          먼저 말하면 '자기 인식이 되는 사람'이 되고, 숨기면 면접에서 추궁당한다.
  best_for: "일반 기업 인사팀, 교육콘텐츠·프로덕션 채용 실무자, 이력서 첨부용 링크"

# ------------------------------------------------------------
# 5. 콘텐츠 재설계 — 형용사에서 증거로
# ------------------------------------------------------------
content_restructure:
  principle: "모든 작업물을 Brief → Problem → Decision → Result 4단으로 전환"
  cases:
    - id: "CASE 01"
      title: "포스코 공사현장 안전교육 영상"
      video_id: "Odns3Lwi-1w"   # 검증됨: 「포스코이앤씨 기업 콘텐츠 영상」
      brief: "20분 분량 공사현장 안전교육 영상 편집 및 최종본 납품"
      problem: "디자인팀 제공 자료만으로는 교육 내용을 충분히 설명할 수 없었음"
      decision:
        - "디자인팀과 협의해 추가 자료 확보"
        - "스토리보드 재구성으로 교육 흐름 재설계"
        - "클라이언트에 중간 시안 공유 → 수정 요청 즉시 반영"
        - "렌더링 실패 발생 → 오류 로그 분석 → 플러그인 충돌 특정 → 렌더링 환경 재세팅"
      result: "20분 분량 최종본 기한 내 납품, 교육 효과 개선"
      before_copy: "렌더링 오류를 직접 추적해 해결했습니다"
      why_changed: "결과만 있고 과정이 없어 '어떻게 일하는 사람인가'가 전달되지 않았음"

    - id: "CASE 02"
      title: "VR 병원 소개 영상"
      video_id: null   # 공개본 없음 → 플레이스홀더 처리
      brief: "입사 첫날 PD 지시로 배정된 VR 콘텐츠 편집 (사수 없음, VR 경험 0)"
      problem: "미경험 포맷 + 고정 기한"
      decision:
        - "지인·커뮤니티·유튜브로 Premiere Pro VR 워크플로 독학"
        - "매일 진행분을 공유해 방향 이탈 리스크 차단"
      result: "1주일 내 1차본 완성 · 기한 준수 → 이후 신규 인턴 리딩 역할 배정"

    - id: "CASE 03"
      title: "천재교육 수학 영상 스토리보드"
      video_id: null   # 공개본 없음 → 플레이스홀더 처리
      brief: "퇴사 후 협업 작가의 재의뢰로 3개월간 스토리보드 작업"
      problem: "스토리보드 첫 경험 — 편집자에서 기획자로 역할 전환 필요"
      decision: "주저하지 않고 작가에게 질문·가이드 요청, 실무자 노하우를 직접 흡수"
      result: "3개월 완주 · 영상의 뼈대를 설계하는 기획 역량 확보"
      strategic_note: "퇴사자에게 다시 일을 맡겼다는 사실 자체가 가장 강력한 레퍼런스"

  gallery:   # 유튜브 실제 제목 그대로 사용
    - { title: "STEP 기업 콘텐츠 영상",          video_id: "8rwn5j6TBUQ" }
    - { title: "KBI 기업 콘텐츠 영상",           video_id: "V_zIek_ELSo" }
    - { title: "아이폰 17 Pro 광고 콘셉트 영상", video_id: "gFPZGNdLp6A" }
    - { title: "아이폰 17 Pro 콘셉트 예고편",    video_id: "BB0tEUYVlbA" }

  honesty_section:
    source: "자기소개서 '실수와 배움' 슬라이드"
    mistake: "클라이언트와 소통 부족으로 작업 오류 발생"
    lesson: "중간 공유와 적극적 커뮤니케이션의 중요성 인지"
    action: "주기적 체크리스트 도입 · 중간 시안 공유 의무화"
    why_included: >
      기존 페이지에서 누락됐던 가장 강력한 자산.
      주니어에게 채용담당자가 가장 알고 싶은 것은 '실패했을 때 어떻게 하는가'이다.

# ------------------------------------------------------------
# 6. 성과 및 학습
# ------------------------------------------------------------
results_and_learning:
  outcome: "배포 후 측정 예정 — 1절 success_kpi 기준. 배포 전 기준선 기록 필수"
  hypotheses_to_test:
    - "H1: 히어로 릴 즉시 노출이 이탈률을 낮춘다 → 기존 페이지 대비 체류시간 비교"
    - "H2: 4단 케이스 구조가 형용사 서술보다 정독률을 높인다 → 스크롤 깊이 비교"
    - "H3: 시안 A(다크)는 크리에이티브 스튜디오, 시안 B(라이트)는 일반 기업 인사팀에서
           각각 응답률이 높다 → 지원처 유형별로 나눠 보내고 응답률 비교"
  ai_collaboration: >
    AI를 카피 생성기가 아니라 '검증 도구'로 사용했다.
    이력서 PDF와 랜딩페이지를 대조해 숫자 불일치 7건을 먼저 찾아낸 뒤 디자인에 착수했으며,
    AI가 제안한 표현 중 근거 없는 형용사('완성도 높은', '탁월한')는 전량 폐기하고
    자기소개서에서 사실로 추적 가능한 문장만 채택했다.
    → 교훈: AI의 첫 출력은 대체로 '듣기 좋은 말'이다. 소스 문서와 대조하지 않으면
      과장이 그대로 페이지에 실린다.

